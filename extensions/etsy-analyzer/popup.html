<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Etsy Analyzer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">05 · Etsy Analyzer</div>
      <p class="sub">Queue listings → short summary here → full report on site.</p>
    </header>

    <label class="field">
      <span>API base</span>
      <input id="apiBase" type="url" placeholder="https://space.cutitaru.com" />
    </label>

    <div class="actions">
      <button id="addBtn" type="button">Add current listing</button>
      <button id="analyzeBtn" type="button" class="primary">Analyze</button>
    </div>

    <section class="auto-box">
      <h2>Search automation</h2>
      <p class="hint">
        On an Etsy search / market page: opens each product in a background tab,
        extracts SEO tags, adds to queue (max 10).
      </p>
      <label class="field inline">
        <span>Max</span>
        <input id="searchLimit" type="number" min="1" max="10" value="10" />
      </label>
      <button id="searchBtn" type="button" class="accent">Add from search</button>
    </section>

    <div class="actions secondary">
      <button id="clearBtn" type="button" class="ghost">Clear queue</button>
      <button id="openAppBtn" type="button" class="ghost">Open web app</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <section>
      <h2>Queue <span id="queueCount">(0)</span></h2>
      <ul id="queue" class="queue"></ul>
    </section>

    <section id="resultSection" class="hidden">
      <h2>Summary</h2>
      <p id="metaLine" class="meta-line"></p>
      <p id="headline" class="headline"></p>
      <ul id="bullets" class="bullets"></ul>
      <div id="bars" class="bars"></div>
      <p id="warnings" class="warnings"></p>
      <button id="fullReportBtn" type="button" class="primary full-report">
        Open full report
      </button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
